services:
  server:
    image: node:20-alpine
    container_name: express-server
    working_dir: /app
    volumes:
      - ./server:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    command: sh -c "npm install && npm run dev"
    networks:
      - app-network

  web:
    image: node:20-alpine
    container_name: vue-web
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://server:3000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
